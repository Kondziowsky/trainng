# Expo Router exports a client-routed SPA (app.json -> web.output: "single"),
# so every path must fall through to index.html. public/_redirects carries the
# same rule and is what Cloudflare Pages reads; this file is for Netlify.

[build]
  command = "npm run build:web"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
